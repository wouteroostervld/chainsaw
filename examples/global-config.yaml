# Chainsaw Global Configuration
# Location: ~/.chainsaw/config.yaml
#
# All of this is optional: without a configuration file chainsaw keeps the
# code graph and skips node_modules, vendor and __pycache__.

version: "3"

# The active profile to use
active_profile: "default"

profiles:
  default:
    # --- Where ---
    # Directories the daemon watches
    include:
      - "~/projects"

    # Directory names skipped by grep, index and the daemon
    exclude:
      - "node_modules"
      - "vendor"
      - "build"
      - "dist"

    # Files never indexed (regular expressions on the absolute path) ...
    blacklist:
      - ".*\\.min\\.js$"
      - ".*\\.pb\\.go$"
    # ... except these
    whitelist: []

    # --- What ---
    # The kinds of index to keep. Each works alone; a kind left out keeps
    # its default. A project can switch them for itself in a .config.yaml.
    index:
      graph: true        # definitions, calls, imports: for "chainsaw query"
      embeddings: false  # a vector per chunk of code: for "chainsaw search"

    # The model that makes embeddings. Only needed, and only used, where the
    # embeddings index is on. Naming a model switches nothing on.
    embeddings:
      model: "nomic-embed-text"            # served by Ollama on localhost
      # base_url: "http://localhost:11434"

  # A profile that embeds everything, with a hosted model
  semantic:
    include:
      - "~/projects"
    exclude:
      - "node_modules"
    index:
      embeddings: true
    embeddings:
      base_url: "https://api.openai.com/v1"   # any OpenAI-compatible server
      api_key: "sk-..."
      model: "text-embedding-3-small"
