name: Nightly Release

on:
  # Manual trigger
  workflow_dispatch:
  # Scheduled nightly at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  # Trigger on version tags
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Compare HEAD with the nightly tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Scheduled runs are skipped when the nightly tag already points at HEAD
          if ! nightly_sha=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" -q .object.sha 2>/dev/null); then
            nightly_sha=""
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$nightly_sha" = "${{ github.sha }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Release Binaries
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Build both binaries
          go build -ldflags="-s -w" -o chainsaw-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/chainsaw

      - name: Compress binaries
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip chainsaw-${{ matrix.goos }}-${{ matrix.goarch }}.zip chainsaw-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          else
            gzip -c chainsaw-${{ matrix.goos }}-${{ matrix.goarch }} > chainsaw-${{ matrix.goos }}-${{ matrix.goarch }}.gz
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainsaw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.gz
            *.zip
          retention-days: 14

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release name
        id: release_name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "name=nightly-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
            echo "tag=nightly" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Remove previous nightly
        if: steps.release_name.outputs.tag == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.release_name.outputs.name }}
          tag_name: ${{ steps.release_name.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_name.outputs.prerelease }}
          files: artifacts/**/*
          body: |
            ## Chainsaw Build - ${{ steps.release_name.outputs.name }}
            
            Automated build containing compressed binaries for multiple platforms.
            
            ### Platforms
            - Linux (amd64, arm64)
            - macOS (amd64, arm64)
            - Windows (amd64)
            
            ### Installation
            1. Download the `.gz` files for your platform (or `.zip` for Windows)
            2. Extract: `gunzip chainsaw*.gz` (or `unzip` for Windows)
            3. Make executable: `chmod +x chainsaw chainsawd` (Unix-like systems)
            4. Move to PATH: `mv chainsaw chainsawd /usr/local/bin/` (or add to your PATH)
            
            Built from commit: ${{ github.sha }}
